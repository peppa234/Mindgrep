# Golden queries for the fixture corpus (eval/corpus).
#
# This is the regression benchmark: small, versioned, runs in CI. It does NOT replace the
# personal benchmark over your own notes and repos (see eval/golden/personal.example.yaml),
# which is the number that belongs in the README.
#
# Labels are stable keys, never database ids, so re-indexing never invalidates them:
#   path    : document path relative to the corpus root (required)
#   symbol  : a defined name (functions, classes, `Class.method`) or a Markdown heading
#   page    : a PDF page number
#   grade   : 2 = the answer, 1 = useful context. Used for NDCG.
# A label with only `path` matches any chunk of that document.
#
# `answerable: false` queries have no answer in the corpus. They are excluded from recall and
# NDCG and used to measure whether scores separate "found it" from "nothing here", which
# sets the abstention threshold for chat.

