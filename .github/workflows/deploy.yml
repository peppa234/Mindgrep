name: Deploy

# Manual on purpose: a personal index is deployed when you decide, not on every push.
# Needs four repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (a key allowed to
# log in to the VPS), DEPLOY_KNOWN_HOSTS (the VPS host key, `ssh-keyscan -H <host>` run once
# from a machine you trust), and the repository checked out at DEPLOY_PATH there (default
# ~/MemoryOs). A pinned host key means a machine impersonating the VPS is refused, not trusted.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        default: main
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/MemoryOs' }}
          REF: ${{ inputs.ref }}
        run: |
          # The ref ends up in a remote shell command: only plain ref characters.
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "invalid ref: $REF" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          [ -n "$KNOWN_HOSTS" ] || { echo "set the DEPLOY_KNOWN_HOSTS secret" >&2; exit 1; }
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" "cd $DEPLOY_PATH && ./infra/deploy.sh '$REF'"
